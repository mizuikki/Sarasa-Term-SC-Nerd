name: Automation - Upstream PR

"on":
  schedule:
    # Weekly on Monday 01:15 UTC (09:15 Asia/Shanghai)
    - cron: "15 1 * * 1"
  workflow_dispatch:

concurrency:
  group: automation-upstream-pr
  cancel-in-progress: true

jobs:
  bump-and-pr:
    runs-on: ubuntu-latest
    # Use PAT (UPSTREAM_BOT_TOKEN) for any write operation (PR creation / auto-merge).
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Ensure UPSTREAM_BOT_TOKEN is set
        env:
          TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "ERROR: missing required repo secret: UPSTREAM_BOT_TOKEN" >&2
            exit 1
          fi

      - name: Install deps
        run: sudo apt update && sudo apt install -y jq unzip p7zip-full

      - name: Bump upstream versions + refresh patcher
        id: bump
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
        run: scripts/bump-upstream-versions.sh --write-github-output

      - name: Create or update PR
        id: cpr
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UPSTREAM_BOT_TOKEN }}
          branch: automation/upstream-update
          delete-branch: true
          labels: automation,upstream
          commit-message: >-
            chore: bump upstream fonts (Sarasa ${{ steps.bump.outputs.sarasa_new }}, Nerd ${{ steps.bump.outputs.nerd_new }})
          title: >-
            chore: bump upstream fonts (Sarasa ${{ steps.bump.outputs.sarasa_new }}, Nerd ${{ steps.bump.outputs.nerd_new }})
          body: |
            Automated upstream version bump.

            - Sarasa-Gothic: `${{ steps.bump.outputs.sarasa_old }}` → `${{ steps.bump.outputs.sarasa_new }}`
            - nerd-fonts: `${{ steps.bump.outputs.nerd_old }}` → `${{ steps.bump.outputs.nerd_new }}`

            This PR updates `scripts/upstream-versions.env` and regenerates `scripts/font-patcher`.
            CI will build full release artifacts and auto-merge on success.

      - name: Enable auto-merge (squash)
        if: steps.cpr.outputs.pull-request-url != ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
        run: gh pr merge --repo "${{ github.repository }}" --auto --squash --delete-branch "${{ steps.cpr.outputs.pull-request-url }}"
