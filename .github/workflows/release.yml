name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt update && sudo apt install -y fontforge python3-fontforge python3-fonttools p7zip jq

      - name: Refresh upstream + build assets
        run: |
          scripts/refresh-upstream.sh
          scripts/build-release-assets.sh

      - name: Get version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SarasaTermSCNerd.ttf.tar.gz
            dist/SarasaTermSCNerd.ttc.tar.gz
            dist/SarasaTermSCNerd.ttf.7z
            dist/SarasaTermSCNerd.ttc.7z
            dist/SarasaTermSCNerd-Unhinted.ttf.tar.gz
            dist/SarasaTermSCNerd-Unhinted.ttc.tar.gz
            dist/SarasaTermSCNerd-Unhinted.ttf.7z
            dist/SarasaTermSCNerd-Unhinted.ttc.7z
          fail_on_unmatched_files: true
