name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v2.4.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install deps
        run: sudo apt update && sudo apt install -y fontforge python3-fontforge python3-fonttools p7zip jq

      - name: Refresh upstream + build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/refresh-upstream.sh
          scripts/build-release-assets.sh

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: |
            dist/SarasaTermSCNerd.ttf.tar.gz
            dist/SarasaTermSCNerd.ttc.tar.gz
            dist/SarasaTermSCNerd.ttf.7z
            dist/SarasaTermSCNerd.ttc.7z
            dist/SarasaTermSCNerd-Unhinted.ttf.tar.gz
            dist/SarasaTermSCNerd-Unhinted.ttc.tar.gz
            dist/SarasaTermSCNerd-Unhinted.ttf.7z
            dist/SarasaTermSCNerd-Unhinted.ttc.7z
          fail_on_unmatched_files: true
