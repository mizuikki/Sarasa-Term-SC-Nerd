name: CI - Upstream Build

"on":
  pull_request:
    paths:
      - "scripts/upstream-versions.env"
      - "scripts/refresh-upstream.sh"
      - "scripts/build-release-assets.sh"
      - "scripts/font-patcher"
      - "scripts/bump-upstream-versions.sh"
      - "font-patcher.patch"
      - "scripts/apply-font-patcher-patch.py"
      - "scripts/sarasa_helpers.py"
      - "scripts/build"
  workflow_dispatch:

concurrency:
  group: ci-upstream-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install deps
        run: sudo apt update && sudo apt install -y fontforge python3-fontforge python3-fonttools p7zip-full jq unzip

      - name: Refresh upstream + build assets
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN != '' && secrets.UPSTREAM_BOT_TOKEN || github.token }}
        run: |
          scripts/refresh-upstream.sh
          scripts/build-release-assets.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Enable auto-merge for automation PR (squash)
        if: github.event_name == 'pull_request' && github.head_ref == 'automation/upstream-update' && secrets.UPSTREAM_BOT_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_BOT_TOKEN }}
        run: gh pr merge --repo "${{ github.repository }}" --auto --squash --delete-branch "${{ github.event.pull_request.html_url }}"
